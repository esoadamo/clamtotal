# Third-party YARA rule sets auto-downloaded for the local YARA engine
# (scripts/update-yara-rules.sh -> $YARA_RULES_DIR/third_party/<name>/).
# One source per line:  <name>|<git-url>|<branch>|<subdir-with-.yar-files>
# Blank lines and lines starting with '#' are ignored.
#
# ONLY license-permitted rule sets may be listed here (verified at add time):
#   - MIT / BSD-2-Clause / Apache-2.0: free to use, copy, modify, redistribute
#   - Detection Rule License (DRL) 1.1: allows use/redistribution/sale, but the
#     upstream LICENSE file must stay next to the rules (the script keeps it) and
#     author attribution in rule metadata must be retained
# Do NOT add copyleft (GPL) or proprietary/"research-only" rule sets.
# The app hot-reloads rules when update-yara-rules.sh touches .rules-stamp.

# ReversingLabs YARA Rules - MIT License - QA'd against 10B+ samples, zero-FP oriented
reversinglabs|https://github.com/reversinglabs/reversinglabs-yara-rules.git|main|yara

# Florian Roth / Neo23x0 signature-base - Detection Rule License (DRL) 1.1
# (large community collection; attribution + LICENSE retained by the script)
# DISABLED BY DEFAULT: its compiled rule set is the biggest memory consumer of the
# yara daemon and can OOM-kill it inside a small container memory limit (clamd also
# holds the signature DB in RAM). Enable only if you raise the container memory
# limit (e.g. compose mem_limit: 8g) — the daemon then needs ~1-2 GB for this set.
# signature-base|https://github.com/Neo23x0/signature-base.git|master|yara

# ditekSHen detection - 2-Clause BSD License - malware family YARA rules
ditekshen|https://github.com/ditekshen/detection.git|master|yara

# ---------------------------------------------------------------------------
# OPTIONAL OPT-IN, NOT license-clean - enable only if you accept the risk:
# YARA Forge packages are built by a GPL-3.0-licensed tool and bundle rules from
# 45+ upstream repos under their ORIGINAL licenses (incl. Elastic License 2.0,
# which forbids hosted/SaaS use). The packaged .yar files carry per-source license
# headers; audit them before enabling. Rules ship as release zips (not in the git
# repo), so the URL below ends in .zip and is downloaded instead of cloned.
# Packages: core (high precision) / extended / full (max coverage, more noise).
# yara-forge-core|https://github.com/YARAHQ/yara-forge/releases/latest/download/yara-forge-rules-core.zip||
# yara-forge-extended|https://github.com/YARAHQ/yara-forge/releases/latest/download/yara-forge-rules-extended.zip||
# yara-forge-full|https://github.com/YARAHQ/yara-forge/releases/latest/download/yara-forge-rules-full.zip||
