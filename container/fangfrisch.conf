[DEFAULT]
db_url = sqlite:////var/lib/clamav/fangfrisch.db
local_directory = /var/lib/clamav
max_file_size = 5M
on_update_exec = true
on_update_timeout = 60

# SaneSecurity — keyless unofficial signature set (includes YARA rules, phishing, ransomware, ...)
[sanesecurity]
enabled = true
prefix = https://mirror.sanesecurity.net/

[securiteinfo]
enabled = false
# free tier requires a (free) registration key:
# customer_id = <your-free-key>

[malwarepatrol]
enabled = false
# requires a subscription key:
# receipt_code = <your-key>
