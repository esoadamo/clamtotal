[DEFAULT]
# NOTE: db_url must live OUTSIDE /var/lib/clamav — clamd loads every file in its DB
# dir as a signature database and dies on the sqlite file ("Malformed database").
db_url = sqlite:////var/lib/fangfrisch/fangfrisch.db
local_directory = /var/lib/clamav
max_file_size = 5M
on_update_exec = true
on_update_timeout = 60

# SaneSecurity — keyless unofficial signature set (includes YARA rules, phishing, ransomware, ...)
# mirror.seichter.de is the current upstream fangfrisch default (mirror.sanesecurity.net is dead)
[sanesecurity]
enabled = true
prefix = http://mirror.seichter.de/sanesecurity/

[securiteinfo]
enabled = false
# Requires a (free) registration: customer_id is the long hex ID from your account
# page (https://www.securiteinfo.com/clients/customers/account). fangfrisch fetches
# the same per-customer URLs as the freshclam DatabaseCustomURL lines shown there.
# Per SecuriteInfo's FAQ, the free (Basic) tier downloads the same core files as paid
# tiers (securiteinfo.hdb, securiteinfohtml.hdb, javascript.ndb, securiteinfoascii.hdb,
# spam_marketing.ndb, securiteinfoandroid.hdb, securiteinfopdf.hdb, securiteinfo.ign2,
# securiteinfoold.hdb), just without the five premium DBs (securiteinfo0hour.hdb,
# securiteinfo.mdb, securiteinfo.yara, securiteinfo.pdb, securiteinfo.wdb) — Basic
# is meant to validate the installation and does not provide zero-hour protection.
# fangfrisch's defaults match the free tier exactly (premium urls are !-disabled),
# so enabling it is enough:
#   [securiteinfo]
#   enabled = true
#   customer_id = <your-hex-id>
# Paid subscribers additionally enable the premium DBs:
#   url_0hour = ${prefix}securiteinfo0hour.hdb
#   url_securiteinfo_mdb = ${prefix}securiteinfo.mdb
#   url_securiteinfo_pdb = ${prefix}securiteinfo.pdb
#   url_securiteinfo_yara = ${prefix}securiteinfo.yara
# customer_id = <your-free-key>

[malwarepatrol]
enabled = false
# requires a subscription key:
# receipt_code = <your-key>
