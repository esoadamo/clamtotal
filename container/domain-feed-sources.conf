# Domain feed lists auto-downloaded for URL/domain scanning (POST /api/v2/urls,
# /ui/url/...). scripts/update-domain-feed.sh reads this file and stores each
# list as $DOMAIN_FEED_DIR/<name>.txt with a '# clamtotal-category: <category>'
# header; the feed daemon imports them into its own database (feed.db) and shows
# the category on matches.
# One source per line:  <name>|<category>|<url>
# Blank lines and lines starting with '#' are ignored.
#
# Sources below are public, freely redistributable lists (see each project's
# license: hagezi CC BY-SA 4.0, StevenBlack public domain, abuse.ch CC0 for the
# API data). Add your own lines the same way, or mount this file over the baked-in
# one: -v ./domain-feed-sources.conf:/etc/domain-feed-sources.conf:ro
# (or point DOMAIN_FEED_SOURCES at another path).

# HaGeZi Threat Intelligence Feeds - malware, phishing, scams, cryptojacking, C2
# (CC BY-SA 4.0) - large list (~1.5M domains); stored in the feed daemon's own SQLite DB
hagezi-tif|malware|https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif.txt

# HaGeZi gambling list (CC BY-SA 4.0) - also used by Mullvad's gambling DNS filter
hagezi-gambling|gambling|https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/gambling-onlydomains.txt

# StevenBlack/hosts - merged ads + malware hosts file (public domain)
stevenblack|ads-malware|https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts

# ---------------------------------------------------------------------------
# URLhaus (abuse.ch) hostfile - malware distribution hosts (API data: CC0).
# DISABLED BY DEFAULT: the keyless download was retired (410 Gone); the v2 export
# needs a free API key from https://urlhaus.abuse.ch/api/ . Get a key, then EITHER
#   - set URLHAUS_AUTH_KEY in the container environment (compose `environment:`
#     or podman -e) — the updater substitutes it into the <URLHAUS_AUTH_KEY>
#     placeholder below, OR
#   - mount your own domain-feed-sources.conf with the key baked into the URL.
# urlhaus|malware|https://urlhaus-api.abuse.ch/v2/files/exports/<URLHAUS_AUTH_KEY>/hostfile.txt
