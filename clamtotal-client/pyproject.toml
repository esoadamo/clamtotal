[project]
name = "clamtotal-client"
version = "0.4.0"
description = "CLI client for a ClamTotal server: scan files, describe reports (VT-style API)"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12"
dependencies = []

[project.scripts]
clamtotal-client = "clamtotal_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clamtotal_client"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=clamtotal_client --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["clamtotal_client"]

[tool.coverage.report]
fail_under = 100
show_missing = true
