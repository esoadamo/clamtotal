services:
  clamtotal:
    build: .
    image: ghcr.io/esoadamo/clamtotal:latest
    container_name: clamtotal
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - clamtotal-data:/data
      # persist downloaded ClamAV signature databases across container restarts,
      # so clamd always finds a valid DB in /var/lib/clamav on start
      - clamav-db:/var/lib/clamav
      # mount your own public YARA rules here (read-only); optional
      # - ./rules:/rules:ro
      # mount your own fangfrisch config (unofficial signature sources, e.g. enable
      # securiteinfo/malwarepatrol keys) over the baked-in /etc/fangfrisch.conf; optional
      # - ./fangfrisch.conf:/etc/fangfrisch.conf:ro
      # (or point FANGFRISCH_CONF at a different path via environment below)
    environment:
      # set to "false" for fully airgapped operation (bake signatures into the image)
      CLAM_AUTOUPDATE: "true"
    restart: unless-stopped

volumes:
  clamtotal-data:
  clamav-db:
