services:
  clamtotal:
    build: .
    image: ghcr.io/esoadamo/clamtotal:latest
    container_name: clamtotal
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - clamtotal-data:/data
      # persist downloaded ClamAV signature databases across container restarts,
      # so clamd always finds a valid DB in /var/lib/clamav on start
      - clamav-db:/var/lib/clamav
      # persist auto-downloaded third-party YARA rules (/rules/third_party)
      # across container restarts; the bundled rules are copied in on first use
      - yara-rules:/rules
      # mount your own public YARA rules here instead (read-only); optional
      # - ./rules:/rules:ro
      # mount your own fangfrisch config (unofficial signature sources, e.g. enable
      # securiteinfo/malwarepatrol keys) over the baked-in /etc/fangfrisch.conf; optional
      # - ./fangfrisch.conf:/etc/fangfrisch.conf:ro
      # (or point FANGFRISCH_CONF at a different path via environment below)
      # mount your own YARA rule sources list over the baked-in one (e.g. to enable
      # the commented yara-forge opt-in entries); optional
      # - ./yara-rules-sources.conf:/etc/yara-rules-sources.conf:ro
      # (or point YARA_RULES_SOURCES at a different path via environment below)
    environment:
      # set to "false" for fully airgapped operation (bake signatures into the image)
      CLAM_AUTOUPDATE: "true"
    # clamd holds the signature DB in RAM and the yara daemon compiles the rule set
    # once — with all default third-party YARA sources that needs several GB total.
    # If workers/daemon get OOM-killed ("Child process died" with no traceback),
    # raise this or trim container/yara-rules-sources.conf.
    # mem_limit: 8g
    restart: unless-stopped

volumes:
  clamtotal-data:
  clamav-db:
  yara-rules:
