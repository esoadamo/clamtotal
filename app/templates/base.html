<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ClamTotal{% endblock %}</title>
<style>
  :root {
    --navy: #14304f;
    --blue: #2f6fb2;
    --blue-dark: #24598f;
    --bg: #f4f6f8;
    --card: #ffffff;
    --border: #dde3ea;
    --text: #1f2d3d;
    --muted: #6b7a8d;
    --red: #d64545;
    --green: #2e9e5b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .topbar { background: var(--navy); color: #fff; }
  .topbar-inner { max-width: 1100px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .brand { color: #fff; font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
  .brand span { color: #7fb3e8; }
  .search { flex: 1; display: flex; min-width: 260px; }
  .search input { flex: 1; padding: 9px 14px; border: none; border-radius: 4px 0 0 4px; font-size: 14px; outline: none; }
  .search button { padding: 9px 18px; border: none; border-radius: 0 4px 4px 0; background: var(--blue); color: #fff; font-size: 14px; cursor: pointer; }
  .search button:hover { background: var(--blue-dark); }
  .container { max-width: 1100px; margin: 28px auto; padding: 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px 24px; margin-bottom: 20px; }
  .card h2 { margin: 0 0 14px; font-size: 17px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .hash { font-family: Consolas, "Courier New", monospace; font-size: 12.5px; word-break: break-all; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; color: #fff; }
  .badge.clean { background: var(--green); }
  .badge.infected { background: var(--red); }
  .btn { display: inline-block; padding: 10px 22px; border: none; border-radius: 4px; background: var(--blue); color: #fff; font-size: 14px; cursor: pointer; }
  .btn:hover { background: var(--blue-dark); text-decoration: none; }
  .btn.secondary { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
  .hero { text-align: center; padding: 44px 24px; }
  .hero h1 { margin: 0 0 8px; font-size: 30px; color: var(--navy); }
  .hero p { color: var(--muted); margin: 0 0 24px; }
  .upload-form { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .upload-form input[type=file] { font-size: 14px; }
  .muted { color: var(--muted); }
  .footer { text-align: center; color: var(--muted); font-size: 12.5px; padding: 24px 0 40px; }
  .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 18px; }
  .tab { background: none; border: none; padding: 10px 18px; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .detection-widget { display: flex; align-items: center; gap: 20px; margin-bottom: 8px; }
  .circle { width: 92px; height: 92px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #fff;
            background: conic-gradient(var(--c, var(--green)) calc(var(--p, 0) * 1%), #e3e8ee 0); }
  .circle-inner { width: 70px; height: 70px; border-radius: 50%; background: #fff; color: var(--text); display: flex; align-items: center; justify-content: center; }
  .det.infected { --c: var(--red); }
  .det.clean { --c: var(--green); }
  .file-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .file-head h1 { margin: 0 0 6px; font-size: 22px; word-break: break-all; }
  .kv { font-size: 13.5px; }
  .kv dt { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.5px; }
  .kv dd { margin: 0 0 10px; word-break: break-all; }
  .sig { color: var(--red); font-weight: 600; }
  ul.urls { margin: 0; padding-left: 20px; font-size: 13.5px; word-break: break-all; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">🛡 Clam<span>Total</span></a>
    <form class="search" action="/search" method="get">
      <input type="text" name="q" placeholder="Search by file hash or file name" value="{{ q | default('', true) }}">
      <button type="submit">Search</button>
    </form>
  </div>
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
<div class="footer">ClamTotal — a VirusTotal-style frontend for ClamAV · 100% airgapped</div>
</body>
</html>
