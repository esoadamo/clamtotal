<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>{% block title %}ClamTotal{% endblock %}</title>
{% set og_title = self.title() %}
<meta property="og:type" content="website">
<meta property="og:site_name" content="ClamTotal">
<meta property="og:title" content="{{ og_title }}">
<meta property="og:description" content="Analyze suspicious files with ClamAV — VirusTotal-style scan reports, self-hosted.">
<meta property="og:image" content="/static/og-card.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ og_title }}">
<meta name="twitter:description" content="Analyze suspicious files with ClamAV — VirusTotal-style scan reports, self-hosted.">
<meta name="twitter:image" content="/static/og-card.svg">
<meta name="theme-color" content="#0f766e">
<style>
  :root {
    --brand: #0f766e;        /* deep teal */
    --brand-dark: #115e59;
    --brand-soft: #ccfbf1;
    --accent: #d97706;       /* amber */
    --accent-soft: #fef3c7;
    --red: #dc2626;
    --red-soft: #fee2e2;
    --orange: #ea580c;
    --orange-soft: #ffedd5;
    --green: #16a34a;
    --green-soft: #dcfce7;
    --bg: #f7f5f0;           /* warm paper */
    --card: #ffffff;
    --border: #e7e2d9;
    --text: #292524;         /* warm stone */
    --muted: #78716c;
    --field: #efe9df;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Avenir Next", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* top app bar */
  .appbar {
    background: var(--card);
    border-bottom: 3px solid var(--brand);
    height: 64px;
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 0 24px;
    box-shadow: 0 1px 4px rgba(41, 37, 36, 0.08);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
  .logo:hover { text-decoration: none; }
  .logo .logo-word em { font-style: normal; color: var(--brand); }
  .logo svg { display: block; }
  .appbar-search { flex: 1; max-width: 720px; margin: 0 auto; display: flex; }
  .appbar-search input {
    flex: 1; height: 40px; border: 1px solid var(--border); border-right: none; border-radius: 20px 0 0 20px;
    background: var(--field); padding: 0 16px; font-size: 14px; outline: none; font-family: inherit; color: var(--text);
  }
  .appbar-search input:focus { background: #fff; border-color: var(--brand); }
  .appbar-search button {
    height: 40px; padding: 0 22px; border: none; border-radius: 0 20px 20px 0;
    background: var(--brand); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .appbar-search button:hover { background: var(--brand-dark); }
  .appbar-right { display: flex; align-items: center; gap: 16px; color: var(--muted); font-size: 13px; font-weight: 500; }

  .container { max-width: 1032px; margin: 28px auto; padding: 0 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 1px 3px rgba(41, 37, 36, 0.06);
    padding: 24px; margin-bottom: 24px;
  }
  .card h2, .section-title {
    font-size: 13px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
    color: var(--muted); margin: 0 0 12px;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; }
  tr:last-child td { border-bottom: none; }
  .mono { font-family: "SF Mono", "Roboto Mono", Consolas, "Courier New", monospace; font-size: 12.5px; word-break: break-all; }
  .muted { color: var(--muted); }

  /* buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 16px; border-radius: 8px; border: none; cursor: pointer;
    background: var(--brand); color: #fff; font-size: 14px; font-weight: 600; font-family: inherit;
  }
  .btn:hover { background: var(--brand-dark); text-decoration: none; }
  .btn.outline { background: #fff; color: var(--brand); border: 1.5px solid var(--brand); }
  .btn.outline:hover { background: var(--brand-soft); }

  /* badges / verdicts */
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge.malicious { background: var(--red-soft); color: var(--red); }
  .badge.harmless { background: var(--green-soft); color: var(--green); }
  .badge.suspicious { background: var(--orange-soft); color: var(--orange); }
  .flag { color: var(--red); font-weight: 600; }
  .ok { color: var(--green); }

  /* tabs */
  .tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab {
    background: none; border: none; padding: 12px 2px; cursor: pointer; font-family: inherit;
    font-size: 13px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
    color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--brand); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* detection ring widget */
  .det-widget { display: flex; align-items: center; gap: 24px; }
  .ring { position: relative; width: 120px; height: 120px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .ring-num {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700;
  }
  .det-text { font-size: 16px; }
  .det-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

  /* upload dropzone */
  .dropzone {
    border: 2px dashed var(--border); border-radius: 12px; padding: 56px 24px;
    text-align: center; color: var(--muted); background: #fdfcf9;
  }
  .dropzone .dz-title { font-size: 18px; color: var(--text); margin: 12px 0 4px; font-weight: 600; }
  .dropzone .dz-or { margin: 16px 0; }
  .hero-title { text-align: center; font-size: 28px; font-weight: 700; margin: 8px 0 24px; color: var(--text); }
  .hero-title em { font-style: normal; color: var(--brand); }

  dl.kv { display: grid; grid-template-columns: 200px 1fr; row-gap: 10px; margin: 0; }
  dl.kv dt { color: var(--muted); font-size: 13px; }
  dl.kv dd { margin: 0; word-break: break-all; }
  ul.ioc { margin: 0; padding-left: 18px; word-break: break-all; }
  pre.raw {
    background: var(--field); padding: 12px; border-radius: 8px; overflow: auto;
    font-size: 12px; max-height: 320px;
  }
  .footer { text-align: center; color: var(--muted); font-size: 12px; padding: 8px 0 32px; }

  /* progress + spinner */
  .spinner {
    width: 40px; height: 40px; margin: 0 auto;
    border: 4px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%;
    animation: ct-spin 0.8s linear infinite;
  }
  @keyframes ct-spin { to { transform: rotate(360deg); } }
  .progress-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 14px; }
  .progress-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; transition: width 0.15s ease; }
  .dz-status { margin-top: 14px; font-size: 14px; color: var(--text); }

  /* modal dialog */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(41, 37, 36, 0.45);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 12px; border-top: 4px solid var(--brand);
    box-shadow: 0 10px 36px rgba(41, 37, 36, 0.3);
    width: 480px; max-width: 92vw; padding: 24px;
  }
  .modal h3 { margin: 0 0 8px; font-size: 18px; font-weight: 700; }
  .modal .modal-body { color: var(--muted); font-size: 13.5px; word-break: break-all; }
  .modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
</style>
</head>
<body>
<header class="appbar">
  <a class="logo" href="/ui/" aria-label="ClamTotal home">
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M16 2 4 7v8c0 7.5 5.1 13 12 15 6.9-2 12-7.5 12-15V7L16 2Z" fill="#0f766e"/>
      <path d="m10.5 16.5 3.8 3.8 7.2-7.6" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <span class="logo-word">Clam<em>Total</em></span>
  </a>
  <form class="appbar-search" action="/ui/search" method="get">
    <input type="text" name="q" placeholder="Search by hash, file name, URL, domain or IP" value="{{ q | default('', true) }}">
    <button type="submit">Search</button>
  </form>
  <div class="appbar-right"><span>ClamAV</span></div>
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
<div class="footer">ClamTotal</div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modal-title">Upload file?</h3>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn outline" id="modal-cancel" type="button">Cancel</button>
      <button class="btn" id="modal-confirm" type="button">Upload and scan</button>
    </div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
