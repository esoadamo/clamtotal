[project]
name = "clamtotal"
version = "0.1.0"
description = "VirusTotal lookalike that scans uploaded files with ClamAV (clamd or clamscan)"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
    "ruff>=0.8",
    "ty>=0.0.1a18",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI idiom: Depends()/File() in argument defaults
"app/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
