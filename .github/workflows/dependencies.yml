name: update-dependencies

on:
  schedule:
    # every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Upgrade all locked dependencies
        run: uv lock --upgrade

      - name: Verify the updated lockfile
        run: |
          uv sync --locked --all-groups
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check
          uv run bandit -r app/ -ll -q
          uv run pytest
          node --test tests/js/app.test.mjs
          uv export --locked --all-groups --no-hashes --no-emit-project --format requirements-txt -o /tmp/reqs.txt
          uvx pip-audit --requirement /tmp/reqs.txt --strict

      - name: Create pull request with updated dependencies
        id: create-pr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          title: "chore(deps): update locked dependencies"
          body: |
            Automated dependency update (`uv lock --upgrade`).

            Verification run in this workflow: ruff, ty, alembic migrations,
            unit tests (100% coverage gate), frontend JS tests, and pip-audit SAST.
          branch: chore/update-dependencies
          commit-message: "chore(deps): update locked dependencies"

      - name: Enable auto-merge (merges automatically once all checks pass)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "0" ]; then
            gh pr merge --auto --squash "$PR_NUMBER"
            echo "Auto-merge enabled on PR #$PR_NUMBER — it merges when the tests workflow passes."
          else
            echo "No dependency changes — nothing to auto-merge."
          fi
