name: deploy

# Fires after the "tests" workflow finishes on main. The container image is only
# published by tests.yml's build-image job when ALL checks pass, so a successful
# "tests" run on main == new image on ghcr.io — then we trigger the server deploy.
# The deploy endpoint credentials live in repo secrets (DEPLOY_TOKEN, DEPLOY_URL);
# secret VALUES are only available inside the runner, never in this file.
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]

permissions: {}  # deploy needs no GitHub API permissions

jobs:
  deploy:
    name: Deploy published image to the server
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5  # deploy must answer within 5 minutes
    steps:
      - name: Trigger deployment (endpoint must return HTTP 200)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          code=$(curl -sS -o /tmp/deploy-resp.txt -w '%{http_code}' --max-time 240 \
            -X PUT -d "$DEPLOY_TOKEN" "$DEPLOY_URL")
          echo "deploy endpoint returned HTTP $code"
          cat /tmp/deploy-resp.txt
          if [ "$code" != "200" ]; then
            echo "::error::deployment failed — expected HTTP 200, got $code"
            exit 1
          fi
          echo "deployment triggered successfully"
