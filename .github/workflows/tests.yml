name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint and format check
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Run migrations check
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/migrations-check.db

      - name: Run unit tests (100% coverage of app/ enforced)
        run: uv run pytest

      - name: Run frontend JS tests
        run: node --test tests/js/app.test.mjs

  build-image:
    name: Build and publish container image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/clamtotal:latest
            ghcr.io/${{ github.repository_owner }}/clamtotal:${{ github.sha }}
