name: tests

# least privilege: jobs only read the repo, except build-image which needs packages: write
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # avoid artipacked credential persistence

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint and format check
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Run migrations check
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/migrations-check.db

      - name: Run unit tests (100% coverage of app/ enforced)
        run: uv run pytest

      - name: Run frontend JS tests
        run: node --test tests/js/app.test.mjs

      - name: Run zizmor workflow-security audit
        run: uvx zizmor==1.32.0 --offline .github/workflows/

  sast:
    name: SAST — bandit source-code scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # avoid artipacked credential persistence

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run bandit on the source code (fail on medium+ severity)
        run: uv run bandit -r app/ -ll -q

  sca:
    name: SCA — vulnerability scan of locked dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # avoid artipacked credential persistence

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Export locked requirements
        run: uv export --locked --all-groups --no-hashes --no-emit-project --format requirements-txt -o /tmp/reqs.txt

      - name: pip-audit (OSV) — fail on any known vulnerability
        run: uvx pip-audit --requirement /tmp/reqs.txt --strict

  build-image:
    name: Build and publish container image
    needs: [test, sast, sca]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push the image to GHCR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # avoid artipacked credential persistence

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile  # the image manifest is a Containerfile, not Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/clamtotal:latest
            ghcr.io/${{ github.repository_owner }}/clamtotal:${{ github.sha }}
